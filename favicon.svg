<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Type Garden">
  <rect width="32" height="32" rx="7" fill="#000000"/>
  <!-- the caret: every garden starts where you type -->
  <rect x="23.6" y="6.6" width="2.7" height="19" rx="1.35" fill="#FFFFFF"/>
  <!-- stem -->
  <path d="M13.6 27.2c-.2-4.3-.8-7-.7-10.1" stroke="#3257FF" stroke-width="2.3" fill="none" stroke-linecap="round"/>
  <!-- leaf -->
  <path d="M13.1 22.2c-3.8-.5-5.9-2.5-6.5-4.8 3.2-.4 5.7 1.5 6.5 4.8z" fill="#3257FF"/>
  <!-- bloom: the same nested swirl the roses are drawn with -->
  <circle cx="13" cy="11" r="7.1" fill="#FF1400"/>
  <g stroke="#FFB4A8" stroke-width="1.45" fill="none" stroke-linecap="round">
    <path d="M9.1 13.6a4.6 4.6 0 1 1 4.6 2.1"/>
    <path d="M15.6 10.1a2.4 2.4 0 1 0-3.4 2.6"/>
  </g>
</svg>
